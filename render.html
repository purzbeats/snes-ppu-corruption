<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SNES PPU Corruption — Offline Renderer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #111;
  color: #ccc;
  font-family: monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}
h1 { color: #8f8; margin-bottom: 10px; font-size: 16px; }
#status { margin: 10px 0; color: #ff8; font-size: 13px; }
#progress-bar {
  width: 600px; height: 20px;
  background: #222; border: 1px solid #444;
  margin: 10px 0;
}
#progress-fill {
  height: 100%; width: 0%;
  background: #4f4;
  transition: width 0.1s;
}
canvas {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  border: 1px solid #333;
  margin: 10px 0;
  max-width: 800px;
}
#controls-panel {
  background: #1a1a1a;
  border: 1px solid #333;
  padding: 15px 20px;
  margin: 10px 0;
  width: 600px;
}
#controls-panel label {
  display: inline-block;
  width: 100px;
  color: #888;
  font-size: 12px;
}
#controls-panel select, #controls-panel input {
  background: #222;
  color: #ccc;
  border: 1px solid #444;
  padding: 4px 8px;
  font-family: monospace;
  font-size: 12px;
  margin: 3px 0;
}
#controls-panel input[type="number"] { width: 80px; }
button {
  background: #2a4a2a;
  color: #8f8;
  border: 1px solid #4f4;
  padding: 8px 24px;
  font-family: monospace;
  font-size: 14px;
  cursor: pointer;
  margin: 5px;
}
button:hover { background: #3a6a3a; }
button:disabled { opacity: 0.4; cursor: default; }
#scene-list { font-size: 10px; color: #555; margin-top: 5px; }
</style>
</head>
<body>
<h1>SNES PPU CORRUPTION — OFFLINE RENDERER</h1>

<div id="controls-panel">
  <div>
    <label>Scene:</label>
    <select id="scene-select"></select>
  </div>
  <div>
    <label>Duration:</label>
    <input type="number" id="duration" value="30" min="1" max="600"> seconds
  </div>
  <div>
    <label>FPS:</label>
    <select id="fps-select">
      <option value="24">24</option>
      <option value="30">30</option>
      <option value="60" selected>60</option>
    </select>
  </div>
  <div>
    <label>Resolution:</label>
    <select id="resolution-select" onchange="applyResolutionPreset()">
      <option value="custom">Custom</option>
      <option value="2">SNES 2x (512x448)</option>
      <option value="3">SNES 3x (768x672)</option>
      <option value="4" selected>SNES 4x (1024x896)</option>
      <option value="5">SNES 5x (1280x1120)</option>
      <option value="6">SNES 6x (1536x1344)</option>
      <option value="7">SNES 7x (1792x1568)</option>
      <option value="8">SNES 8x (2048x1792)</option>
      <option value="10">SNES 10x (2560x2240)</option>
      <option value="12">SNES 12x (3072x2688)</option>
      <option value="16">SNES 16x (4096x3584)</option>
      <option value="1080p">1080p</option>
      <option value="4k">4K</option>
    </select>
    <span style="color:#555;font-size:10px;margin-left:5px" id="res-display">1024x896</span>
  </div>
  <div>
    <label>Width:</label>
    <input type="number" id="render-w" value="1024" min="128" max="8192" step="8" onchange="document.getElementById('resolution-select').value='custom';updateResDisplay()">
    <label style="width:auto;margin-left:10px">Height:</label>
    <input type="number" id="render-h" value="896" min="112" max="8192" step="8" onchange="document.getElementById('resolution-select').value='custom';updateResDisplay()">
  </div>
  <div>
    <label>Format:</label>
    <select id="format-select">
      <option value="mp4">MP4 video (H.264)</option>
      <option value="webm">WebM video (VP9)</option>
      <option value="frames">PNG frames (zip)</option>
    </select>
  </div>
  <div style="margin-top: 10px">
    <button id="btn-render" onclick="startRender()">RENDER</button>
    <button id="btn-cancel" onclick="cancelRender()" disabled>CANCEL</button>
    <button id="btn-preview" onclick="startPreview()">PREVIEW</button>
  </div>
</div>

<div id="status">Ready</div>
<div id="progress-bar"><div id="progress-fill"></div></div>
<canvas id="screen" width="256" height="224"></canvas>

<!-- Hidden UI elements that engine.js expects -->
<div id="ui" style="display:none"></div>
<div id="controls" style="display:none"></div>

<script src="ppu.js"></script>
<script>
// Prevent both ppu.js standalone boot AND engine.js auto-boot
const ENGINE_LOADED = true;
const OFFLINE_RENDER = true;
</script>
<script src="engine.js"></script>
<script>
// ============================================================
//  OFFLINE RENDERER
// ============================================================

let rendering = false;
let cancelled = false;

// Resolution preset handler
function applyResolutionPreset() {
  const val = document.getElementById("resolution-select").value;
  let w, h;
  if (val === "custom") return;
  if (val === "1080p") { w = 1920; h = 1080; }
  else if (val === "4k") { w = 3840; h = 2160; }
  else {
    const scale = parseInt(val);
    w = 256 * scale;
    h = 224 * scale;
  }
  document.getElementById("render-w").value = w;
  document.getElementById("render-h").value = h;
  updateResDisplay();
}

function updateResDisplay() {
  const w = document.getElementById("render-w").value;
  const h = document.getElementById("render-h").value;
  document.getElementById("res-display").textContent = w + "x" + h;
}

// Populate scene dropdown
function populateScenes() {
  const sel = document.getElementById("scene-select");
  const opt0 = document.createElement("option");
  opt0.value = "random";
  opt0.textContent = "Random";
  sel.appendChild(opt0);

  for (let i = 0; i < scenes.length; i++) {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = `${i}: ${scenes[i].name}`;
    sel.appendChild(opt);
  }
}

// Parse URL params for headless/automated use
function parseURLParams() {
  const params = new URLSearchParams(window.location.search);
  if (params.has("scene")) document.getElementById("scene-select").value = params.get("scene");
  if (params.has("duration")) document.getElementById("duration").value = params.get("duration");
  if (params.has("fps")) document.getElementById("fps-select").value = params.get("fps");
  if (params.has("width")) document.getElementById("render-w").value = params.get("width");
  if (params.has("height")) document.getElementById("render-h").value = params.get("height");
  if (params.has("auto")) setTimeout(startRender, 500);
}

function setStatus(msg) {
  document.getElementById("status").textContent = msg;
}

function setProgress(pct) {
  document.getElementById("progress-fill").style.width = pct + "%";
}

// Preview: just run the normal engine on selected scene
function startPreview() {
  const sceneVal = document.getElementById("scene-select").value;
  const w = parseInt(document.getElementById("render-w").value) || 256;
  const h = parseInt(document.getElementById("render-h").value) || 224;

  resizePPU(w, h);
  canvas.style.maxWidth = "800px";
  canvas.style.width = "auto";
  canvas.style.height = "auto";

  resetPPU();
  generateEnhancedTiles();

  const sceneIdx = sceneVal === "random" ? Math.floor(Math.random() * scenes.length) : parseInt(sceneVal);
  currentScene = sceneIdx;
  scenes[sceneIdx].setup();
  sceneTimer = 0;
  sceneElapsedMs = 0;
  sceneAutoAdvance = false;
  sceneTransitionPhase = 0;
  sceneBrightness = 1.0;
  frozen = false;
  lastFrameTime = performance.now();

  setStatus("Previewing: " + scenes[sceneIdx].name + " (close tab or click RENDER to stop)");
  mainLoop();
}

async function startRender() {
  if (rendering) return;
  rendering = true;
  cancelled = false;
  frozen = true; // stop any live preview

  document.getElementById("btn-render").disabled = true;
  document.getElementById("btn-cancel").disabled = false;

  const sceneVal = document.getElementById("scene-select").value;
  const durationSec = parseFloat(document.getElementById("duration").value) || 30;
  const fps = parseInt(document.getElementById("fps-select").value) || 60;
  const w = parseInt(document.getElementById("render-w").value) || 256;
  const h = parseInt(document.getElementById("render-h").value) || 224;
  const format = document.getElementById("format-select").value;
  const totalFrames = Math.ceil(durationSec * fps);
  const frameDeltaMs = 1000 / fps;

  // Setup PPU at render resolution
  resizePPU(w, h);

  // Initialize
  resetPPU();
  generateEnhancedTiles();
  rebuildCGRAMCache();

  const sceneIdx = sceneVal === "random" ? Math.floor(Math.random() * scenes.length) : parseInt(sceneVal);
  currentScene = sceneIdx;
  scenes[sceneIdx].setup();
  sceneTimer = 0;
  sceneElapsedMs = 0;
  transitionElapsedMs = 0;
  sceneTransitionPhase = 0;
  sceneBrightness = 1.0;
  sceneAutoAdvance = false;

  setStatus(`Rendering ${scenes[sceneIdx].name} — ${totalFrames} frames at ${w}x${h} ${fps}fps...`);
  setProgress(0);

  if (format === "mp4" || format === "webm") {
    await renderToVideo(sceneIdx, totalFrames, frameDeltaMs, fps, w, h, format);
  } else {
    await renderToFrames(sceneIdx, totalFrames, frameDeltaMs, fps, w, h);
  }

  document.getElementById("btn-render").disabled = false;
  document.getElementById("btn-cancel").disabled = true;
  rendering = false;
}

function cancelRender() {
  cancelled = true;
  setStatus("Cancelling...");
}

// Render one frame at a fixed timestep (no rAF dependency)
function renderOneFrame(frameDeltaMs) {
  // Clear HDMA
  if (hdmaEffects.length > 12) {
    hdmaEffects = hdmaEffects.slice(-4);
  } else if (glitchRand() < 0.08) {
    hdmaEffects = hdmaEffects.slice(-4);
  }

  mosaicSize = 1;
  updateSceneDirector(frameDeltaMs);
  updateColorCycling();
  renderFrame();
  frameCount++;
}

// --- Video output via MediaRecorder (MP4 H.264 or WebM VP9) ---
async function renderToVideo(sceneIdx, totalFrames, frameDeltaMs, fps, w, h, format) {
  const stream = canvas.captureStream(0); // 0 = manual frame capture
  const track = stream.getVideoTracks()[0];

  // Pick the best available codec for the requested format
  let mimeType, fileExt;
  if (format === "mp4") {
    // Try H.264 MP4 variants
    const mp4Types = [
      "video/mp4;codecs=avc1.640028",   // H.264 High
      "video/mp4;codecs=avc1.4d0028",   // H.264 Main
      "video/mp4;codecs=avc1.42e01e",   // H.264 Baseline
      "video/mp4;codecs=avc1",
      "video/mp4",
    ];
    mimeType = mp4Types.find(t => MediaRecorder.isTypeSupported(t));
    if (!mimeType) {
      // Fallback: some browsers support H.264 in WebM container
      const fallbacks = [
        "video/webm;codecs=h264",
        "video/webm;codecs=avc1",
      ];
      mimeType = fallbacks.find(t => MediaRecorder.isTypeSupported(t));
      if (mimeType) {
        fileExt = "webm"; // H.264 in WebM container
        setStatus("Note: MP4 not supported, using H.264 in WebM container");
        await new Promise(r => setTimeout(r, 1000));
      }
    }
    if (!mimeType) {
      // Last resort: fall back to VP9 WebM
      setStatus("Note: MP4/H.264 not supported in this browser, falling back to WebM VP9");
      await new Promise(r => setTimeout(r, 1500));
      format = "webm";
    } else {
      fileExt = fileExt || "mp4";
    }
  }

  if (format === "webm") {
    const webmTypes = [
      "video/webm;codecs=vp9",
      "video/webm;codecs=vp8",
      "video/webm",
    ];
    mimeType = webmTypes.find(t => MediaRecorder.isTypeSupported(t));
    fileExt = "webm";
  }

  if (!mimeType) {
    setStatus("Error: No supported video codec found in this browser.");
    return;
  }

  // High bitrate for quality (~CRF 13 equivalent)
  // CRF 13 in H.264 is roughly 80-120% of the raw pixel bandwidth
  const bitrate = Math.max(8000000, w * h * fps * 2);

  const recorder = new MediaRecorder(stream, {
    mimeType,
    videoBitsPerSecond: bitrate
  });

  const chunks = [];
  recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };

  const done = new Promise((resolve) => { recorder.onstop = resolve; });
  recorder.start();

  const batchSize = 4;

  for (let frame = 0; frame < totalFrames; frame++) {
    if (cancelled) break;

    renderOneFrame(frameDeltaMs);

    if (track.requestFrame) {
      track.requestFrame();
    }

    if (frame % batchSize === 0) {
      const pct = ((frame / totalFrames) * 100).toFixed(1);
      setProgress(parseFloat(pct));
      const mbEst = ((chunks.reduce((a, c) => a + c.size, 0)) / 1048576).toFixed(1);
      setStatus(`Rendering ${scenes[sceneIdx].name} — frame ${frame}/${totalFrames} (${pct}%) — ~${mbEst}MB`);
      await new Promise(r => setTimeout(r, 0));
    }
  }

  recorder.stop();
  await done;

  if (!cancelled) {
    const blob = new Blob(chunks, { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `snes_${scenes[sceneIdx].name.toLowerCase().replace(/\s+/g, "_")}_${w}x${h}_${fps}fps.${fileExt}`;
    a.click();
    URL.revokeObjectURL(url);
    const sizeMB = (blob.size / 1048576).toFixed(1);
    setStatus(`Done! ${totalFrames} frames, ${sizeMB}MB ${fileExt.toUpperCase()}. File downloading.`);
    setProgress(100);
  } else {
    setStatus("Cancelled.");
    setProgress(0);
  }
}

// --- PNG frame sequence output ---
async function renderToFrames(sceneIdx, totalFrames, frameDeltaMs, fps, w, h) {
  // We'll collect frames and zip them
  // For simplicity, use individual downloads if no zip library,
  // or accumulate blobs in memory
  setStatus("Rendering frames to memory...");

  const frameBlobs = [];
  const batchSize = 2;

  for (let frame = 0; frame < totalFrames; frame++) {
    if (cancelled) break;

    renderOneFrame(frameDeltaMs);

    // Capture frame as PNG blob
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    frameBlobs.push({ name: `frame_${String(frame).padStart(6, "0")}.png`, blob });

    if (frame % batchSize === 0) {
      const pct = ((frame / totalFrames) * 100).toFixed(1);
      setProgress(parseFloat(pct));
      setStatus(`Rendering frames — ${frame}/${totalFrames} (${pct}%) — ${(frameBlobs.length * blob.size / 1048576).toFixed(0)}MB in memory`);
      await new Promise(r => setTimeout(r, 0));
    }
  }

  if (cancelled) {
    setStatus("Cancelled.");
    setProgress(0);
    return;
  }

  // Build a simple ZIP file (no library needed — minimal ZIP format)
  setStatus("Building ZIP...");
  await new Promise(r => setTimeout(r, 50));

  const zipBlob = await buildZip(frameBlobs);
  const url = URL.createObjectURL(zipBlob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `snes_${scenes[sceneIdx].name.toLowerCase().replace(/\s+/g, "_")}_${w}x${h}_${fps}fps_frames.zip`;
  a.click();
  URL.revokeObjectURL(url);

  setStatus(`Done! ${frameBlobs.length} frames rendered. ZIP downloading.`);
  setProgress(100);
}

// Minimal ZIP builder (no compression — store only, keeps it simple and fast)
async function buildZip(files) {
  const localHeaders = [];
  const centralHeaders = [];
  let offset = 0;

  for (const file of files) {
    const data = new Uint8Array(await file.blob.arrayBuffer());
    const nameBytes = new TextEncoder().encode(file.name);

    // Local file header
    const local = new Uint8Array(30 + nameBytes.length + data.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true);  // signature
    lv.setUint16(4, 20, true);           // version needed
    lv.setUint16(6, 0, true);            // flags
    lv.setUint16(8, 0, true);            // compression (store)
    lv.setUint16(10, 0, true);           // mod time
    lv.setUint16(12, 0, true);           // mod date
    lv.setUint32(14, 0, true);           // crc32 (0 for store)
    lv.setUint32(18, data.length, true); // compressed size
    lv.setUint32(22, data.length, true); // uncompressed size
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);           // extra length
    local.set(nameBytes, 30);
    local.set(data, 30 + nameBytes.length);
    localHeaders.push(local);

    // Central directory header
    const central = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(central.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true);
    cv.setUint16(14, 0, true);
    cv.setUint32(16, 0, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0x20, true);
    cv.setUint32(42, offset, true);
    central.set(nameBytes, 46);
    centralHeaders.push(central);

    offset += local.length;
  }

  const centralOffset = offset;
  let centralSize = 0;
  for (const c of centralHeaders) centralSize += c.length;

  // End of central directory
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, centralOffset, true);
  ev.setUint16(20, 0, true);

  return new Blob([...localHeaders, ...centralHeaders, eocd], { type: "application/zip" });
}

// --- Init ---
console.log("Engine loaded, scenes available:", scenes.length);
populateScenes();
parseURLParams();
applyResolutionPreset();
updateResDisplay();

// Show first frame as thumbnail
try {
  resizePPU(256, 224);
  resetPPU();
  generateEnhancedTiles();

  const thumbScene = document.getElementById("scene-select").value;
  const thumbIdx = thumbScene === "random" ? 0 : parseInt(thumbScene);
  currentScene = thumbIdx;
  scenes[thumbIdx].setup();
  sceneTransitionPhase = 0;
  sceneBrightness = 1.0;
  rebuildCGRAMCache();
  reallocScanlineBuffers();
  renderFrame();
} catch (e) {
  console.warn("Thumbnail render failed:", e);
}
</script>
</body>
</html>
